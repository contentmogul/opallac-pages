<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Assets</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
  }
  .app { display: flex; min-height: 100vh; }
  nav {
    width: 260px; flex-shrink: 0;
    background: #ffffff; border-right: 1px solid #e2e2e6;
    overflow-y: auto; padding: 12px 0;
  }
  nav h1 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
    color: #8a8a8e; margin: 4px 20px 10px; font-weight: 600;
  }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li a {
    display: block; padding: 10px 20px; color: #333; text-decoration: none;
    font-size: 14px; border-left: 3px solid transparent;
  }
  nav li a:hover { background: #f0f0f2; }
  nav li a.active { background: #eaf1fd; border-left-color: #1a73e8; color: #1a73e8; font-weight: 600; }
  main { flex: 1; min-width: 0; padding: 28px 32px 60px; max-width: 1500px; }
  h2.campaign-title { margin: 0 0 24px; font-size: 22px; color: #222; }
  section { margin-bottom: 40px; }
  section > h3 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
    color: #8a8a8e; margin: 0 0 12px; font-weight: 700;
  }

  .status { color: #8a8a8e; font-size: 14px; padding: 20px 0; }
  .status.error { color: #c0392b; white-space: pre-wrap; }

  /* Copy-variant table */
  .scroll-hint {
    font-size: 12px; color: #8a8a8e; margin: 0 0 6px; text-align: center;
  }
  .table-wrap { position: relative; overflow-x: auto; border: 1px solid #e2e2e6; border-radius: 10px; background: #fff; }
  /* Right-edge fade signals "more columns this way" — only added when the
     table actually overflows, and fades out once scrolled to the end. */
  .table-wrap.scrollable::after {
    content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 28px;
    background: linear-gradient(to right, transparent, #fff);
    pointer-events: none; opacity: 1; transition: opacity 0.2s;
  }
  .table-wrap.scrollable.at-end::after { opacity: 0; }
  table.copy-table { border-collapse: collapse; width: 100%; min-width: 640px; }
  table.copy-table th, table.copy-table td {
    padding: 10px 14px; border-bottom: 1px solid #eee; font-size: 14px;
    text-align: left; vertical-align: top;
  }
  table.copy-table th {
    background: #fafafa; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em;
    color: #666; font-weight: 700; white-space: nowrap;
  }
  table.copy-table tr:last-child td { border-bottom: none; }
  table.copy-table td.wrap { white-space: pre-line; word-break: break-word; min-width: 200px; }
  table.copy-table td.approved-cell { text-align: center; }
  table.copy-table td.feedback-cell { min-width: 340px; }
  table.copy-table th.copy-number-cell, table.copy-table td.copy-number-cell { width: 60px; white-space: nowrap; }
  table.copy-table td textarea {
    width: 100%; min-height: 90px; font: inherit; padding: 8px;
    border: 1px solid #ccc; border-radius: 6px; resize: vertical;
  }

  /* Campaign-level info, shown once */
  .field-grid { display: grid; grid-template-columns: 220px 1fr; border: 1px solid #e2e2e6; border-radius: 10px; overflow: hidden; background: #fff; }
  .field-grid .field-label, .field-grid .field-value {
    padding: 12px 16px; border-top: 1px solid #eee; font-size: 14px;
  }
  .field-grid > :nth-child(-n+2) { border-top: none; }
  .field-label {
    font-weight: 700; color: #444; text-transform: uppercase; font-size: 12px;
    letter-spacing: 0.02em;
  }
  .field-value { color: #222; white-space: pre-line; word-break: break-word; }
  .field-value:empty::before { content: "—"; color: #ccc; }

  .save-indicator {
    display: inline-block; font-size: 12px; font-weight: 600; color: #8a8a8e;
    margin-left: 8px; white-space: nowrap;
  }
  .save-indicator.pending { color: #b8860b; }
  .save-indicator.ok { color: #1a8a3e; }
  .save-indicator.err { color: #c0392b; }

  /* Full-size asset blocks (images + video), each with its own feedback.
     Capped narrower than the page's full content width per Lionel's request. */
  .asset-block {
    background: #fff; border: 1px solid #e2e2e6; border-radius: 10px;
    overflow: hidden; margin-bottom: 24px; max-width: 420px;
  }
  .asset-block h4 {
    margin: 0; padding: 10px 16px; font-size: 13px; font-weight: 700;
    color: #444; background: #fafafa; border-bottom: 1px solid #eee;
    word-break: break-all;
  }
  .asset-block img { display: block; width: 100%; height: auto; background: #f0f0f2; }
  /* padding-top is set inline per-video from its real aspect ratio (Drive's
     videoMediaMetadata), falling back to 16:9 only when that's unavailable. */
  .asset-block .video-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
  .asset-block .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .asset-feedback {
    display: grid; grid-template-columns: 160px 1fr; gap: 0;
    border-top: 1px solid #eee;
  }
  .asset-feedback > div { padding: 12px 16px; font-size: 14px; }
  .asset-feedback .field-label { font-weight: 700; color: #444; text-transform: uppercase; font-size: 12px; }
  .asset-feedback label.checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .asset-feedback textarea {
    width: 100%; min-height: 60px; font: inherit; padding: 8px;
    border: 1px solid #ccc; border-radius: 6px; resize: vertical;
  }

  @media (prefers-color-scheme: dark) {
    html, body { background: #1c1c1e; }
    nav { background: #2c2c2e; border-right-color: #3a3a3c; }
    nav li a { color: #ddd; }
    nav li a:hover { background: #3a3a3c; }
    nav li a.active { background: #1e3a5f; }
    h2.campaign-title { color: #eee; }
    .table-wrap, table.copy-table th, .field-grid, .asset-block { background: #2c2c2e; border-color: #3a3a3c; }
    .table-wrap.scrollable::after { background: linear-gradient(to right, transparent, #2c2c2e); }
    .scroll-hint { color: #8a8a8e; }
    table.copy-table th, .asset-block h4 { background: #262628; }
    table.copy-table th, table.copy-table td, .field-grid .field-label, .field-grid .field-value, .asset-feedback { border-color: #3a3a3c; }
    .field-label, table.copy-table th, .asset-feedback .field-label { color: #bbb; }
    .field-value, table.copy-table td { color: #eee; }
    .asset-block img { background: #1c1c1e; }
  }
  @media (max-width: 720px) {
    .app { flex-direction: column; }
    nav { width: 100%; border-right: 0; border-bottom: 1px solid #e2e2e6; max-height: 30vh; }
    .field-grid, .asset-feedback { grid-template-columns: 140px 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <nav>
    <h1>Campaigns</h1>
    <ul id="nav-list"></ul>
  </nav>
  <main>
    <h2 class="campaign-title" id="campaign-title">Select a campaign</h2>
    <div id="content"><div class="status">Choose a campaign from the left.</div></div>
  </main>
</div>

<script>
  const IMAGE_FULL = (id) => `https://drive.google.com/thumbnail?sz=w2000&id=${id}`;
  const VIDEO_PREVIEW = (id) => `https://drive.google.com/file/d/${id}/preview`;

  // Which sheet headers form the compact copy-variant table vs. the
  // once-only campaign-info block. Approved/Feedback are handled specially
  // (rendered as editable controls) rather than falling into either bucket.
  const COPY_TABLE_PATTERN = /copy number|hook concepts|body copy|headlines?/i;
  const COPY_NUMBER_PATTERN = /copy number/i;
  const APPROVED_PATTERN = /approved/i;
  const FEEDBACK_PATTERN = /feedback/i;

  let CAMPAIGNS = [];
  let API_ENDPOINT = null;

  const navList = document.getElementById('nav-list');
  const content = document.getElementById('content');
  const titleEl = document.getElementById('campaign-title');

  function renderNav(activeId) {
    navList.innerHTML = '';
    CAMPAIGNS.forEach(c => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '?folder=' + encodeURIComponent(c.folderId);
      a.textContent = c.label;
      if (c.folderId === activeId) a.classList.add('active');
      a.addEventListener('click', (e) => {
        e.preventDefault();
        loadCampaign(c, true);
      });
      li.appendChild(a);
      navList.appendChild(li);
    });
  }

  function apiUrl(params) {
    const url = new URL(API_ENDPOINT);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    return url.toString();
  }

  async function postUpdate(body) {
    const res = await fetch(API_ENDPOINT, {
      method: 'POST',
      // text/plain avoids the CORS preflight an application/json body would
      // trigger; the backend parses the text as JSON itself.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error || 'Unknown error.');
    return result;
  }

  // A debounced save that hasn't fired yet is lost if the page closes,
  // reloads, or navigates away first — that happened once already (a typed
  // comment that never reached the Sheet). Every attachAutoSave field
  // registers a flush function here, and pagehide/visibilitychange flush
  // anything still pending via sendBeacon, which (unlike fetch) is not
  // cancelled when the page is being torn down.
  const pendingFlushers = new Set();
  function flushAllPending() {
    pendingFlushers.forEach(flush => flush());
  }
  window.addEventListener('pagehide', flushAllPending);
  window.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushAllPending();
  });

  // Wires a checkbox or textarea to auto-save. `buildPayload(value)` returns
  // the exact POST body for the current value — used both for the normal
  // fetch-based save (checkboxes immediately, text fields debounced + on
  // blur) and for the emergency sendBeacon flush on unload.
  function attachAutoSave(el, statusEl, buildPayload) {
    let debounceTimer = null;
    let hasPending = false;

    function currentValue() {
      return el.type === 'checkbox' ? el.checked : el.value;
    }

    async function doSave() {
      hasPending = false;
      statusEl.textContent = 'Saving…';
      statusEl.className = 'save-indicator';
      try {
        const result = await postUpdate(buildPayload(currentValue()));
        if (!result.ok) throw new Error(result.error || 'Unknown error.');
        statusEl.textContent = 'Saved ✓';
        statusEl.className = 'save-indicator ok';
        setTimeout(() => { if (statusEl.textContent === 'Saved ✓') statusEl.textContent = ''; }, 2500);
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.className = 'save-indicator err';
      }
    }

    function flushNow() {
      if (!hasPending) return;
      hasPending = false;
      clearTimeout(debounceTimer);
      try {
        const blob = new Blob([JSON.stringify(buildPayload(currentValue()))], { type: 'text/plain' });
        navigator.sendBeacon(API_ENDPOINT, blob);
      } catch (err) {
        // Best-effort only — nothing more we can do once the page is closing.
      }
    }
    pendingFlushers.add(flushNow);

    if (el.type === 'checkbox') {
      el.addEventListener('change', doSave);
    } else {
      el.addEventListener('input', () => {
        hasPending = true;
        statusEl.textContent = 'Unsaved…';
        statusEl.className = 'save-indicator pending';
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(doSave, 600);
      });
      el.addEventListener('blur', () => {
        if (!hasPending) return;
        clearTimeout(debounceTimer);
        doSave();
      });
    }
  }

  async function loadCampaign(campaign, pushState) {
    titleEl.textContent = campaign.label;
    content.innerHTML = '<div class="status">Loading…</div>';
    renderNav(campaign.folderId);

    if (pushState) {
      const url = new URL(location.href);
      url.searchParams.set('folder', campaign.folderId);
      history.pushState({ folder: campaign.folderId }, '', url);
    }

    if (!API_ENDPOINT || API_ENDPOINT.includes('REPLACE_WITH')) {
      content.innerHTML = '<div class="status error">config.json\'s "apiEndpoint" is not set.</div>';
      return;
    }

    let folderData;
    try {
      const res = await fetch(apiUrl({ action: 'folder', folderId: campaign.folderId }));
      folderData = await res.json();
      if (!folderData.ok) throw new Error(folderData.error || 'Unknown error reading the folder.');
    } catch (err) {
      content.innerHTML = '<div class="status error">Could not load this folder:\n' + err.message + '</div>';
      return;
    }

    const sheetSections = [];
    for (const sheet of folderData.sheets) {
      try {
        const res = await fetch(apiUrl({ action: 'sheet', sheetId: sheet.id }));
        const sheetData = await res.json();
        if (!sheetData.ok) throw new Error(sheetData.error || 'Unknown error reading the sheet.');
        sheetSections.push({ sheet, sheetData });
      } catch (err) {
        sheetSections.push({ sheet, error: err.message });
      }
    }

    // Per-asset (image/video) feedback is keyed by filename in an "Asset
    // Feedback" tab of the campaign's primary sheet — the first sheet found
    // in the folder, if any. Prefetch what's already saved so boxes aren't
    // blank on every visit.
    let assetFeedbackByFile = {};
    const primarySheetId = folderData.sheets[0] && folderData.sheets[0].id;
    if (primarySheetId) {
      try {
        const res = await fetch(apiUrl({ action: 'assetFeedback', sheetId: primarySheetId }));
        const data = await res.json();
        if (data.ok) assetFeedbackByFile = data.byFile || {};
      } catch (err) {
        // Non-fatal — asset feedback boxes just start blank.
      }
    }

    renderCampaign(folderData, sheetSections, primarySheetId, assetFeedbackByFile);
  }

  function renderCopyTable(headers, rows, sheet) {
    const copyHeaders = headers.filter(h => COPY_TABLE_PATTERN.test(h));
    const approvedHeader = headers.find(h => APPROVED_PATTERN.test(h));
    const feedbackHeader = headers.find(h => FEEDBACK_PATTERN.test(h));
    if (!copyHeaders.length) return null;

    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const table = document.createElement('table');
    table.className = 'copy-table';

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    [...copyHeaders, approvedHeader && 'Approved', feedbackHeader && 'Feedback']
      .filter(Boolean)
      .forEach(h => {
        const th = document.createElement('th');
        if (COPY_NUMBER_PATTERN.test(h)) th.className = 'copy-number-cell';
        th.textContent = h.replace(/\s*\n\s*/g, ' ').replace(/:$/, '');
        headRow.appendChild(th);
      });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    rows.forEach(({ row, values }) => {
      const tr = document.createElement('tr');
      copyHeaders.forEach(h => {
        const td = document.createElement('td');
        td.className = COPY_NUMBER_PATTERN.test(h) ? 'copy-number-cell' : 'wrap';
        td.textContent = values[h] || '';
        tr.appendChild(td);
      });

      if (approvedHeader) {
        const td = document.createElement('td');
        td.className = 'approved-cell';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = values[approvedHeader] === true || String(values[approvedHeader]).toUpperCase() === 'TRUE';
        const status = document.createElement('span');
        status.className = 'save-indicator';
        // sheet.name is the Drive FILE title, not the sheet's internal tab
        // name — they don't match on the real Opallac sheet. Omit sheetName
        // so the backend auto-resolves the first tab, same fix as commit
        // 407930e for the old row-save path (regression caught live by
        // platform on this follow-up — see CONA-2774).
        attachAutoSave(cb, status, (value) =>
          ({ sheetId: sheet.id, row, updates: { [approvedHeader]: value } })
        );
        td.appendChild(cb);
        td.appendChild(status);
        tr.appendChild(td);
      }

      if (feedbackHeader) {
        const td = document.createElement('td');
        td.className = 'feedback-cell';
        const ta = document.createElement('textarea');
        ta.value = values[feedbackHeader] || '';
        const status = document.createElement('span');
        status.className = 'save-indicator';
        attachAutoSave(ta, status, (value) =>
          ({ sheetId: sheet.id, row, updates: { [feedbackHeader]: value } })
        );
        td.appendChild(ta);
        td.appendChild(document.createElement('br'));
        td.appendChild(status);
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
  }

  function renderCampaignInfo(headers, rows) {
    const excluded = h => COPY_TABLE_PATTERN.test(h) || APPROVED_PATTERN.test(h) || FEEDBACK_PATTERN.test(h);
    const infoHeaders = headers.filter(h => h.trim() && !excluded(h));
    if (!infoHeaders.length) return null;

    const grid = document.createElement('div');
    grid.className = 'field-grid';
    infoHeaders.forEach(h => {
      // Campaign-level fields are expected constant across rows — show the
      // first non-blank value found for this header, across all rows.
      const value = rows.map(r => r.values[h]).find(v => v != null && String(v).trim() !== '') || '';
      const label = document.createElement('div');
      label.className = 'field-label';
      label.textContent = h.replace(/\s*\n\s*/g, ' ');
      const val = document.createElement('div');
      val.className = 'field-value';
      val.textContent = value;
      grid.appendChild(label);
      grid.appendChild(val);
    });
    return grid;
  }

  function renderAssetFeedbackControls(fileName, primarySheetId, existing) {
    const grid = document.createElement('div');
    grid.className = 'asset-feedback';

    const approvedLabel = document.createElement('div');
    approvedLabel.className = 'field-label';
    approvedLabel.textContent = 'Approved';
    const approvedVal = document.createElement('div');
    const wrap = document.createElement('label');
    wrap.className = 'checkbox';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = existing && (existing.Approved === true || String(existing.Approved).toUpperCase() === 'TRUE');
    const cbStatus = document.createElement('span');
    cbStatus.className = 'save-indicator';
    wrap.appendChild(cb);
    wrap.appendChild(document.createTextNode('Approved'));
    approvedVal.appendChild(wrap);
    approvedVal.appendChild(cbStatus);
    grid.appendChild(approvedLabel);
    grid.appendChild(approvedVal);

    const feedbackLabel = document.createElement('div');
    feedbackLabel.className = 'field-label';
    feedbackLabel.textContent = 'Feedback';
    const feedbackVal = document.createElement('div');
    const ta = document.createElement('textarea');
    ta.value = (existing && existing.Feedback) || '';
    const taStatus = document.createElement('span');
    taStatus.className = 'save-indicator';
    feedbackVal.appendChild(ta);
    feedbackVal.appendChild(document.createElement('br'));
    feedbackVal.appendChild(taStatus);
    grid.appendChild(feedbackLabel);
    grid.appendChild(feedbackVal);

    if (!primarySheetId) return grid; // No sheet in this folder to save into.

    attachAutoSave(cb, cbStatus, (value) =>
      ({ sheetId: primarySheetId, fileName, updates: { Approved: value } })
    );
    attachAutoSave(ta, taStatus, (value) =>
      ({ sheetId: primarySheetId, fileName, updates: { Feedback: value } })
    );
    return grid;
  }

  function renderCampaign(folderData, sheetSections, primarySheetId, assetFeedbackByFile) {
    content.innerHTML = '';

    for (const { sheet, sheetData, error } of sheetSections) {
      const section = document.createElement('section');
      const h3 = document.createElement('h3');
      h3.textContent = sheet.name;
      section.appendChild(h3);

      if (error) {
        const div = document.createElement('div');
        div.className = 'status error';
        div.textContent = error;
        section.appendChild(div);
        content.appendChild(section);
        continue;
      }

      const { headers, rows } = sheetData;

      // Campaign details first (Lionel's request) — the copy table repeats
      // per variant, so leading with the once-only overview reads better.
      const campaignInfo = renderCampaignInfo(headers, rows);
      if (campaignInfo) {
        const infoHeading = document.createElement('h3');
        infoHeading.textContent = 'Campaign details';
        infoHeading.style.marginBottom = '12px';
        section.appendChild(infoHeading);
        section.appendChild(campaignInfo);
      }

      const copyTable = renderCopyTable(headers, rows, sheet);
      if (copyTable) {
        if (campaignInfo) {
          const copyHeading = document.createElement('h3');
          copyHeading.textContent = 'Copy';
          copyHeading.style.marginTop = '24px';
          section.appendChild(copyHeading);
        }
        section.appendChild(copyTable);
      }

      content.appendChild(section);
    }

    if (folderData.images.length) {
      const section = document.createElement('section');
      const h3 = document.createElement('h3');
      h3.textContent = 'Static creatives';
      section.appendChild(h3);
      folderData.images.forEach(img => {
        const block = document.createElement('div');
        block.className = 'asset-block';
        const h4 = document.createElement('h4');
        h4.textContent = img.name;
        block.appendChild(h4);
        const el = document.createElement('img');
        el.src = IMAGE_FULL(img.id);
        el.alt = img.name;
        el.loading = 'lazy';
        block.appendChild(el);
        block.appendChild(renderAssetFeedbackControls(img.name, primarySheetId, assetFeedbackByFile[img.name]));
        section.appendChild(block);
      });
      content.appendChild(section);
    }

    if (folderData.videos.length) {
      const section = document.createElement('section');
      const h3 = document.createElement('h3');
      h3.textContent = 'Videos';
      section.appendChild(h3);
      folderData.videos.forEach(v => {
        const block = document.createElement('div');
        block.className = 'asset-block';
        const h4 = document.createElement('h4');
        h4.textContent = v.name;
        block.appendChild(h4);
        const wrap = document.createElement('div');
        wrap.className = 'video-wrap';
        // Real aspect ratio from Drive's videoMediaMetadata when available,
        // instead of assuming 16:9 — this video is actually portrait, and
        // forcing landscape either stretched or letterboxed it.
        if (v.width && v.height) {
          wrap.style.paddingTop = (v.height / v.width * 100) + '%';
        }
        const iframe = document.createElement('iframe');
        iframe.src = VIDEO_PREVIEW(v.id);
        iframe.allow = 'autoplay';
        iframe.title = v.name;
        wrap.appendChild(iframe);
        block.appendChild(wrap);
        block.appendChild(renderAssetFeedbackControls(v.name, primarySheetId, assetFeedbackByFile[v.name]));
        section.appendChild(block);
      });
      content.appendChild(section);
    }

    if (!sheetSections.length && !folderData.images.length && !folderData.videos.length) {
      content.innerHTML = '<div class="status">This folder has no images, videos, or sheets yet.</div>';
    }

    setupScrollHints();
  }

  // A table that needs horizontal scrolling gives no visual signal that
  // more columns exist off-screen — easy to miss, especially on mobile
  // (Lionel's report: the card looked "complete" at 2 columns). Adds a
  // fade on the scrollable edge plus an explicit hint line, both only when
  // the table actually overflows its container, and the fade clears once
  // scrolled to the end.
  function setupScrollHints() {
    document.querySelectorAll('.table-wrap').forEach(wrap => {
      const table = wrap.querySelector('table');
      if (!table) return;
      const needsScroll = table.scrollWidth > wrap.clientWidth + 1;
      wrap.classList.toggle('scrollable', needsScroll);
      if (!needsScroll) return;

      const prev = wrap.previousElementSibling;
      if (!prev || !prev.classList.contains('scroll-hint')) {
        const hint = document.createElement('div');
        hint.className = 'scroll-hint';
        hint.textContent = '← Scroll sideways to see the rest of the table →';
        wrap.parentNode.insertBefore(hint, wrap);
      }

      function updateFadeState() {
        const atEnd = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 1;
        wrap.classList.toggle('at-end', atEnd);
      }
      updateFadeState();
      wrap.addEventListener('scroll', updateFadeState, { passive: true });
    });
  }

  window.addEventListener('resize', () => setupScrollHints());

  async function init() {
    let API_CLIENTS = [];
    try {
      const [clientsRes, configRes] = await Promise.all([
        fetch('./clients.json', { cache: 'no-store' }),
        fetch('./config.json', { cache: 'no-store' })
      ]);
      API_CLIENTS = await clientsRes.json();
      const config = await configRes.json();
      API_ENDPOINT = config.apiEndpoint;
    } catch (err) {
      content.innerHTML = '<div class="status error">Could not load clients.json or config.json.</div>';
      return;
    }

    if (!API_ENDPOINT || API_ENDPOINT.includes('REPLACE_WITH')) {
      content.innerHTML = '<div class="status error">config.json\'s "apiEndpoint" is not set.</div>';
      return;
    }

    // Pull every active campaign from every client's registry Sheet.
    for (const c of API_CLIENTS) {
      try {
        const res = await fetch(apiUrl({ action: 'registry', sheetId: c.registrySheetId }));
        const data = await res.json();
        if (data.ok) CAMPAIGNS.push(...data.rows.map(r => ({ label: `${c.client} — ${r.label}`, folderId: r.folderId })));
      } catch (err) {
        // Skip a client whose registry can't be read rather than failing the whole page.
      }
    }

    const params = new URLSearchParams(location.search);
    const requestedId = params.get('folder');
    renderNav(requestedId);

    const target = CAMPAIGNS.find(c => c.folderId === requestedId) || CAMPAIGNS[0];
    if (target) loadCampaign(target, !requestedId);
    else content.innerHTML = '<div class="status">No active campaigns found in any client registry.</div>';
  }

  window.addEventListener('popstate', () => {
    const params = new URLSearchParams(location.search);
    const id = params.get('folder');
    const target = CAMPAIGNS.find(c => c.folderId === id);
    if (target) loadCampaign(target, false);
  });

  init();
</script>

</body>
</html>
