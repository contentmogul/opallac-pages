<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Document</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e2e2e6;
    font-size: 14px;
    color: #444;
  }
  .bar a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: #1a73e8;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    white-space: nowrap;
  }
  .bar a:hover { background: #1558b0; }
  .bar .hint { flex: 1; min-width: 0; }
  .frame-wrap {
    position: relative;
    width: 100%;
    height: calc(100vh - 49px);
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #1c1c1e; }
    .bar { background: #2c2c2e; border-bottom-color: #3a3a3c; color: #ccc; }
  }
</style>
</head>
<body>

  <div class="bar">
    <span class="hint">If this shows a Lark sign-in screen instead of the document, use the button — some browsers block the anonymous session inside an embedded frame.</span>
    <a href="https://lf658ur4x5.sg.larksuite.com/docx/GUsIdGKAIo2JKIxH0Kdld3d1gzf?from=from_copylink" target="_blank" rel="noopener">
      Open directly ↗
    </a>
  </div>

  <div class="frame-wrap">
    <iframe
      src="https://lf658ur4x5.sg.larksuite.com/docx/GUsIdGKAIo2JKIxH0Kdld3d1gzf?from=from_copylink"
      title="Shared Lark document"
      allow="clipboard-write; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager">
    </iframe>
  </div>

</body>
</html>
