<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Plans</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
  }
  .app { display: flex; height: 100vh; }
  nav {
    width: 280px;
    flex-shrink: 0;
    background: #ffffff;
    border-right: 1px solid #e2e2e6;
    overflow-y: auto;
    padding: 8px 0 12px;
  }
  .folder-group + .folder-group { margin-top: 4px; }
  .folder-header {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    background: none;
    border: none;
    text-align: left;
    padding: 10px 20px 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #8a8a8e;
    font-weight: 700;
    cursor: pointer;
  }
  .folder-header .chev { transition: transform 0.15s ease; font-size: 10px; }
  .folder-header.collapsed .chev { transform: rotate(-90deg); }
  .folder-header:hover { color: #555; }
  nav ul { list-style: none; margin: 0; padding: 0; }
  .folder-group.collapsed ul { display: none; }
  nav li a {
    display: block;
    padding: 9px 20px 9px 24px;
    color: #333;
    text-decoration: none;
    font-size: 14px;
    border-left: 3px solid transparent;
  }
  nav li a:hover { background: #f0f0f2; }
  nav li a.active {
    background: #eaf1fd;
    border-left-color: #1a73e8;
    color: #1a73e8;
    font-weight: 600;
  }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e2e2e6;
    font-size: 14px;
    color: #444;
  }
  .bar .title { font-weight: 600; color: #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .title .crumb { color: #8a8a8e; font-weight: 400; }
  .bar a.open-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: #1a73e8;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .bar a.open-link:hover { background: #1558b0; }
  .frame-wrap { position: relative; flex: 1; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a8a8e;
    font-size: 15px;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #1c1c1e; }
    nav { background: #2c2c2e; border-right-color: #3a3a3c; }
    nav li a { color: #ddd; }
    nav li a:hover { background: #3a3a3c; }
    nav li a.active { background: #1e3a5f; }
    .bar { background: #2c2c2e; border-bottom-color: #3a3a3c; color: #ccc; }
    .bar .title { color: #eee; }
  }
  @media (max-width: 720px) {
    .app { flex-direction: column; }
    nav { width: 100%; height: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid #e2e2e6; }
  }
</style>
</head>
<body>

<div class="app">
  <nav id="nav-root"></nav>
  <main>
    <div class="bar">
      <span class="title" id="doc-title">Select a document</span>
      <a class="open-link" id="open-link" href="#" target="_blank" rel="noopener" style="display:none;">Open in Lark ↗</a>
    </div>
    <div class="frame-wrap" id="frame-wrap">
      <div class="empty" id="empty-state">Choose a document from the left.</div>
    </div>
  </main>
</div>

<script>
  // Doc list lives in docs.json, grouped by folder to mirror the Lark Drive
  // structure (Opallac > Campaign Plans, and any sibling folders added later).
  // Add new docs via the "Add campaign doc" GitHub Action, or edit docs.json
  // directly — each entry's "id" is the token from the Lark share URL, e.g. in
  // https://lf658ur4x5.sg.larksuite.com/docx/GUsIdGKAIo2JKIxH0Kdld3d1gzf?from=from_copylink
  // the id is GUsIdGKAIo2JKIxH0Kdld3d1gzf (everything between /docx/ and the ?).
  const LARK_BASE = "https://lf658ur4x5.sg.larksuite.com/docx/";

  const navRoot = document.getElementById('nav-root');
  const frameWrap = document.getElementById('frame-wrap');
  const titleEl = document.getElementById('doc-title');
  const openLink = document.getElementById('open-link');

  let FOLDERS = [];

  function larkUrl(id) {
    return LARK_BASE + id + "?from=from_copylink";
  }

  function findDoc(id) {
    for (const folder of FOLDERS) {
      const doc = folder.docs.find(d => d.id === id);
      if (doc) return { doc, folder };
    }
    return null;
  }

  function renderNav(activeId) {
    navRoot.innerHTML = '';
    FOLDERS.forEach((folder, fi) => {
      const group = document.createElement('div');
      group.className = 'folder-group';

      const header = document.createElement('button');
      header.type = 'button';
      header.className = 'folder-header';
      header.innerHTML = '<span class="chev">▾</span><span>' + folder.folder + '</span>';
      header.addEventListener('click', () => {
        group.classList.toggle('collapsed');
      });
      group.appendChild(header);

      const ul = document.createElement('ul');
      folder.docs.forEach(doc => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '?doc=' + encodeURIComponent(doc.id);
        a.textContent = doc.title;
        if (doc.id === activeId) a.classList.add('active');
        a.addEventListener('click', (e) => {
          e.preventDefault();
          loadDoc(doc.id, true);
        });
        li.appendChild(a);
        ul.appendChild(li);
      });
      group.appendChild(ul);
      navRoot.appendChild(group);
    });
  }

  function loadDoc(id, pushState) {
    const hit = findDoc(id);
    if (!id || id === 'REPLACE_WITH_DOC_ID') return;

    frameWrap.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.src = larkUrl(id);
    iframe.title = hit ? hit.doc.title : id;
    iframe.setAttribute('allow', 'clipboard-write; fullscreen');
    iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    frameWrap.appendChild(iframe);

    if (hit) {
      titleEl.innerHTML = '<span class="crumb">' + hit.folder.folder + ' / </span>' + hit.doc.title;
    } else {
      titleEl.textContent = id;
    }
    openLink.href = larkUrl(id);
    openLink.style.display = 'inline-flex';

    renderNav(id);

    if (pushState) {
      const url = new URL(location.href);
      url.searchParams.set('doc', id);
      history.pushState({ doc: id }, '', url);
    }
  }

  function firstAvailableDoc() {
    for (const folder of FOLDERS) {
      for (const doc of folder.docs) {
        if (doc.id && doc.id !== 'REPLACE_WITH_DOC_ID') return doc;
      }
    }
    return null;
  }

  function init() {
    fetch('./docs.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        FOLDERS = data;
        const params = new URLSearchParams(location.search);
        const requestedId = params.get('doc');

        renderNav(requestedId);

        if (requestedId) {
          loadDoc(requestedId, false);
        } else {
          const first = firstAvailableDoc();
          if (first) loadDoc(first.id, true);
        }
      })
      .catch(err => {
        titleEl.textContent = 'Could not load docs.json';
        console.error(err);
      });
  }

  window.addEventListener('popstate', () => {
    const params = new URLSearchParams(location.search);
    const id = params.get('doc');
    if (id) loadDoc(id, false);
  });

  init();
</script>

</body>
</html>
